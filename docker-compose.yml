services:
  jenkins-update-center:
    build: .
    image: registry.ohmvir.dev/jenkins-update-center
    container_name: jenkins-update-center
    restart: always
    ports:
      - "${UPDATE_CENTER_PORT:-8089}:80"
    environment:
      - NEXUS_URL=${NEXUS_URL}
      - NEXUS_USER=${NEXUS_USER}
      - NEXUS_PASS=${NEXUS_PASS}
      - CF_ACCESS_CLIENT_ID=${CF_ACCESS_CLIENT_ID:-}
      - CF_ACCESS_CLIENT_SECRET=${CF_ACCESS_CLIENT_SECRET:-}
      - UPDATE_CENTER_URL=${UPDATE_CENTER_URL:-http://localhost:8089}
    volumes:
      # Holds the published site, the Nexus download cache and the signing key.
      # Keep it across upgrades: Jenkins trusts the certificate generated here.
      - update_center_data:/var/lib/update-center

volumes:
  update_center_data:
